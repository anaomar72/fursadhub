spring:
  application:
    name: fursadhub-api

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: false

  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

  # Final-report upload (CLAUDE.md section 48). Deliberately a little above the 15 MB per-document
  # cap enforced by FileClassification, so an oversized upload is rejected by FursadHub's own
  # validation with a machine-readable code rather than by the servlet container.
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

# FursadHub API base prefix for all business endpoints: /api/v1

fursadhub:
  cors:
    allowed-origins: ${FURSADHUB_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    issuer: ${JWT_ISSUER:fursadhub}
    audience: ${JWT_AUDIENCE:fursadhub-api}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:10m}
    public-key-location: ${JWT_PUBLIC_KEY:}
    private-key-location: ${JWT_PRIVATE_KEY:}
  auth:
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:30d}
    email-verification-token-ttl: ${EMAIL_VERIFICATION_TOKEN_TTL:10m}
    password-reset-token-ttl: ${PASSWORD_RESET_TOKEN_TTL:1h}
    email-verification-resend-cooldown: ${EMAIL_VERIFICATION_RESEND_COOLDOWN:60s}
    email-verification-code-secret: ${EMAIL_VERIFICATION_CODE_SECRET:}
    # Login abuse limits, per 15-minute sliding window (CLAUDE.md section 21).
    login-max-attempts-per-email: ${LOGIN_MAX_ATTEMPTS_PER_EMAIL:10}
    login-max-attempts-per-ip: ${LOGIN_MAX_ATTEMPTS_PER_IP:30}
  cookie:
    secure: ${COOKIE_SECURE:false}
    domain: ${COOKIE_DOMAIN:}
  notification:
    from-address: ${SMTP_FROM:no-reply@fursadhub.local}
    app-base-url: ${APP_BASE_URL:http://localhost:5173}
  # Solves the first-admin problem (CLAUDE.md section 23): platform roles can only be granted by an
  # existing SUPER_ADMIN, so with an empty table nobody could ever become one. When this names an
  # ALREADY REGISTERED account and no active platform grant exists yet, startup promotes that one
  # account. It is inert once any admin exists, so it cannot later be used to quietly restore
  # platform authority to an account someone deliberately revoked. Blank by default.
  administration:
    bootstrap-super-admin-email: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:}
  # Private S3-compatible object storage for student documents (CLAUDE.md section 47, ADR-004).
  # The `filesystem` provider is for local development only and is refused outright in staging and
  # production by StorageConfig.
  storage:
    provider: ${STORAGE_PROVIDER:s3}
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:fursadhub-local}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    filesystem-directory: ${STORAGE_FILESYSTEM_DIRECTORY:}
